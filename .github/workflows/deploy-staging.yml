name: Deploy to Staging Server

on:
  push:
    branches: [staging]
  pull_request:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (defaults to staging)"
        required: false
        default: "staging"

jobs:
  deploy:
    name: Deploy to Staging Server
    uses: ./.github/workflows/_deploy.yml
    secrets:
      SSH_HOST: ${{ secrets.SERVER_IP_STAGING }}
      SSH_USER: ${{ secrets.SERVER_USER_STAGING }}
      SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY_STAGING }}
      APP_PATH: ${{ secrets.APP_PATH_STAGING }}
    with:
      environment_name: staging
      branch: ${{ inputs.ref || 'staging' }}
      composer_flags: "--no-interaction --no-progress --prefer-dist --optimize-autoloader --no-dev"