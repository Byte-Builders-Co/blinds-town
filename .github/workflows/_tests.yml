name: Run Tests

on:
  workflow_call:
    inputs:
      branch:
        type: string
        required: false
        default: ''
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24.18.0'

      - name: Install Node Dependencies
        run: npm i

      - name: Install Dependencies
        run: composer install -q --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build:ssr

      - name: Run Type Analysis
        run: composer types:check

      - name: Tests
        run: php artisan test --parallel --processes=4 --compact --stop-on-failure

      - name: Frontend tests
        run: npm run test:coverage
        env:
          # vitest.config.ts extends vite.config.ts, whose laravel-vite-plugin
          # refuses to start its dev server when it detects CI. Vitest isn't
          # serving HMR, so the check doesn't apply here.
          LARAVEL_BYPASS_ENV_CHECK: "1"
