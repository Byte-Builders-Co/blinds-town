name: Reusable Deploy (SSH)

on:
  workflow_call:
    inputs:
      environment_name:
        type: string
        required: true
      branch:
        type: string
        required: true
      composer_flags:
        type: string
        required: false
        default: ""
      run_optimize:
        type: boolean
        required: false
        default: true
      run_verify:
        type: boolean
        required: false
        default: true
    secrets:
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      SSH_PORT:
        required: false
      APP_PATH:
        required: true
      SSH_KNOWN_HOSTS:
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (${{ inputs.environment_name }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Validate deploy secrets
        shell: bash
        run: |
          set -euo pipefail
          SSH_HOST="${{ secrets.SSH_HOST }}"
          SSH_USER="${{ secrets.SSH_USER }}"
          SSH_PRIVATE_KEY="${{ secrets.SSH_PRIVATE_KEY }}"
          APP_PATH="${{ secrets.APP_PATH }}"

          missing=0

          if [ -z "${SSH_HOST}" ]; then echo "Missing required secret: SSH_HOST" >&2; missing=1; fi
          if [ -z "${SSH_USER}" ]; then echo "Missing required secret: SSH_USER" >&2; missing=1; fi
          if [ -z "${SSH_PRIVATE_KEY}" ]; then echo "Missing required secret: SSH_PRIVATE_KEY" >&2; missing=1; fi
          if [ -z "${APP_PATH}" ]; then echo "Missing required secret: APP_PATH" >&2; missing=1; fi

          if [ "${missing}" -ne 0 ]; then
            echo "" >&2
            echo "Tip: You can store SSH_* and APP_PATH as GitHub Environment secrets (dev/staging/production) using the same names." >&2
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 120s
          command_timeout: 30m
          script: |
            set -eu
            set -o pipefail 2>/dev/null || true

            : "${APP_PATH:=${{ secrets.APP_PATH }}}"

            DEPLOY_BRANCH="${{ inputs.branch }}"
            COMPOSER_FLAGS="${{ inputs.composer_flags }}"
            RUN_OPTIMIZE="${{ inputs.run_optimize }}"

            cd "${APP_PATH}"

            echo "==> Deploying '${{ inputs.environment_name }}' from '${DEPLOY_BRANCH}'"
            echo "==> Path: ${APP_PATH}"
            echo "==> Time: $(date -Is || date)"

            if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              git fetch origin "${DEPLOY_BRANCH}" --prune
              git reset --hard
              git clean -fd
              git checkout -B "${DEPLOY_BRANCH}" "origin/${DEPLOY_BRANCH}"
            else
              echo "ERROR: APP_PATH is not a git repo: ${APP_PATH}" >&2
              exit 1
            fi

            php artisan down || true
            eval "composer install ${COMPOSER_FLAGS}"
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            if [ "${RUN_OPTIMIZE}" = "true" ]; then
              php artisan optimize:clear
              php artisan optimize
            else
              php artisan optimize:clear
            fi
            
            npm run build:ssr
            php artisan migrate --force
            php artisan permission:cache-reset
            php artisan storage:link || true
            php artisan queue:restart
            php artisan inertia:stop-ssr || true
            php artisan up || true

            echo "==> Deploy complete"
